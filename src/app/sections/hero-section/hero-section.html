<section data-aos="fade-up" class="bg-amber-50 pt-24 pb-16 text-center">
  <div
    class="bg-cover bg-center h-[75vh] flex items-center justify-start"
    [ngStyle]="{'background-image': 'url(' + heroBg + ')'}"
  >
    <div class="max-w-screen-xl px-20">
      <h1 class="text-5xl font-extrabold text-off-white mb-4">Welcome to Zoe Seed Schools</h1>
      <p class="text-lg text-amber-50 mb-8">
        Empowering students with knowledge, character, and excellence.
      </p>
      <div >
        <button class="px-6 py-3 text-white outline-2 outline-offset-2 outline-blue-700 hover:bg-blue-700 hover:outline-0 rounded-lg font-medium mr-7">
          Enroll Now
        </button>
        <button class="px-6 py-3 text-white outline-2 outline-offset-2 outline-blue-700 hover:bg-blue-700 hover:outline-0 rounded-lg font-medium mr-7">
          Learn More
        </button>
        <button class="px-6 py-3 text-white outline-2 outline-offset-2 outline-blue-700 hover:bg-blue-700 hover:outline-0 rounded-lg font-medium">
          Take A virtual Tour
        </button>
      </div>

    </div>
  </div>
</section>
